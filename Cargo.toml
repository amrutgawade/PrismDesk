[workspace]
resolver = "2"
members = [
    "spikes/mf-smoke",
    "spikes/scrcpy-dump",
    "crates/pd-render",
    "crates/pd-decode",
    "crates/pd-audio",
    "crates/pd-engine",
]

# Shared dependency versions for the whole workspace.
[workspace.dependencies]
windows = "0.58"
windows-core = "0.58"

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Proprietary"

# Release profile tuned for the latency-critical hot path.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
