[package]
name = "pd-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pd-engine"
path = "src/main.rs"

[dependencies]
pd-render = { path = "../pd-render" }
pd-decode = { path = "../pd-decode" }
pd-audio = { path = "../pd-audio" }
windows-core.workspace = true
mp4 = "0.14"
bytes = "1"
clipboard-win = "5"
eframe = "0.29"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Media_MediaFoundation",
    "Win32_UI_WindowsAndMessaging",
]
